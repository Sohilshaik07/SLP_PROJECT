# ============================================================
# SLP Project Configuration
# Robustness and Generalization of Multilingual Transformer
# Models for Hate Speech Detection in Indian Code-Mixed Text
# ============================================================

# ----------------------------
# Project Metadata
# ----------------------------
project:
  title: "Robustness and Generalization of Multilingual Transformer Models for Hate Speech Detection in Indian Code-Mixed Text"
  version: "1.0.0"
  review: 1

# ----------------------------
# Paths
# ----------------------------
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_demo: "data/demo"
  models: "models"
  results_figures: "results/figures"
  results_metrics: "results/metrics"
  results_predictions: "results/predictions"
  logs: "logs"

# ----------------------------
# Dataset Configuration
# ----------------------------
dataset:
  # PRIMARY: HASOC 2021 English-Hindi Code-Mix
  # Place official files in: data/raw/hasoc2021/
  # Loader will auto-detect columns on first run.
  active: "hasoc2021"

  hasoc2021:
    raw_dir: "data/raw/hasoc2021"
    # Column names are detected automatically on first load.
    # These are overridden once the actual file is inspected.
    text_column: null        # auto-detected
    label_column: null       # auto-detected
    positive_label: "HOF"   # Hate or Offensive (expected)
    negative_label: "NOT"   # Not hate/offensive (expected)

  bohra2018:
    raw_dir: "data/raw/bohra"
    text_column: null
    label_column: null
    positive_label: "Hate Speech"
    negative_label: "Normal Speech"
    note: "Only tweet IDs available without Twitter API"

  hold_telugu:
    raw_dir: "data/raw/hold_telugu"
    train_filename: "training_data_telugu-hate.xlsx"
    test_filename: "telugu-hate-speech-test.xlsx"
    text_column: "Comments"
    label_column: "Label"
    positive_label: "hate"
    negative_label: "non-hate"

  demo:
    raw_dir: "data/demo"
    filename: "demo_dataset.csv"
    text_column: "text"
    label_column: "label"
    positive_label: "HOF"
    negative_label: "NOT"

# ----------------------------
# Preprocessing
# ----------------------------
preprocessing:
  remove_urls: true
  remove_mentions: true
  preserve_hashtag_text: true     # #BJP → BJP
  remove_hashtag_symbol_only: true
  normalize_whitespace: true
  preserve_emojis: true
  remove_exact_duplicates: true
  # DO NOT translate, lemmatize, or stem
  translate_to_english: false
  stem: false
  lemmatize: false

# ----------------------------
# Data Splitting
# ----------------------------
splitting:
  test_size: 0.10
  val_size: 0.10
  train_size: 0.80
  random_state: 42
  stratify: true

# ----------------------------
# TF-IDF + Logistic Regression
# ----------------------------
logistic_regression:
  tfidf:
    word_ngram_range: [1, 2]
    char_ngram_range: [2, 4]
    max_features: 50000
    sublinear_tf: true
    min_df: 2
  model:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
    random_state: 42

# ----------------------------
# TF-IDF + Linear SVM
# ----------------------------
linear_svm:
  tfidf:
    word_ngram_range: [1, 2]
    char_ngram_range: [2, 4]
    max_features: 50000
    sublinear_tf: true
    min_df: 2
  model:
    C: 1.0
    max_iter: 2000
    random_state: 42

# ----------------------------
# XLM-RoBERTa
# ----------------------------
xlmr:
  model_name: "xlm-roberta-base"
  max_length: 128
  batch_size: 16
  learning_rate: 2.0e-5
  num_epochs: 5
  warmup_ratio: 0.1
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  fp16: false                # Set true if GPU supports it
  random_seed: 42
  save_strategy: "epoch"
  metric_for_best_model: "macro_f1"
  early_stopping_patience: 3

  # Debug/fast mode: use tiny subset for verifying pipeline
  debug_mode: false
  debug_max_samples: 100

# ----------------------------
# Evaluation
# ----------------------------
evaluation:
  primary_metric: "macro_f1"
  report_digits: 4
  save_confusion_matrix: true
  save_classification_report: true

# ----------------------------
# Robustness (Review 2)
# ----------------------------
robustness:
  # Will be populated in Review 2
  cross_dataset_experiments: []
  representation_perturbations: []
